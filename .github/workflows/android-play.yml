name: Android Play Bundle
on:
  push:
    branches:
      - android-play-production
  workflow_dispatch:

jobs:
  android-bundle:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK API 36
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        working-directory: web
        run: npm install
      - name: Build web
        working-directory: web
        env:
          VITE_API_BASE_URL: https://tracevnid.fyi
          VITE_PI_SANDBOX: "false"
        run: npm run build
      - name: Generate Capacitor Android project
        working-directory: web
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
      - name: Configure API 36 and permissions
        working-directory: web
        run: |
          sed -i -E 's/compileSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/compileSdkVersion = 36/' android/variables.gradle
          sed -i -E 's/targetSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/targetSdkVersion = 36/' android/variables.gradle
          python -c 'from pathlib import Path; p=Path("android/app/src/main/AndroidManifest.xml"); s=p.read_text(); perms="    <uses-permission android:name=\"android.permission.INTERNET\" />\\n    <uses-permission android:name=\"android.permission.CAMERA\" />\\n    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />\\n    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />\\n"; p.write_text(s if "android.permission.CAMERA" in s else s.replace("<application",perms+"    <application",1))'
          ! grep -q 'ACCESS_BACKGROUND_LOCATION' android/app/src/main/AndroidManifest.xml
      - name: Configure Play release version
        working-directory: web
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i -E 's/versionName "[^"]+"/versionName "1.0.0"/' android/app/build.gradle
      - name: Configure release signing
        working-directory: web/android
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          python - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle")
          s=p.read_text()
          signing="""android {
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """
          s=s.replace("android {", signing, 1)
          s=s.replace("buildTypes {", "buildTypes {\n        release { signingConfig signingConfigs.release }", 1)
          p.write_text(s)
          PY
      - name: Build release AAB
        working-directory: web/android
        run: ./gradlew bundleRelease
      - name: Verify release signing
        working-directory: web/android
        run: |
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/*.aab
          test -s app/build/outputs/bundle/release/*.aab
      - name: Upload release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: trace-ai-x-play-aab-ci
          path: web/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Upload draft to Google Play closed testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ai.trace.traceai
          releaseFiles: web/android/app/build/outputs/bundle/release/*.aab
          track: alpha
          status: draft
