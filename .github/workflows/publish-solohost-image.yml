name: Publish SoloHost Image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "app/**"
      - "web/**"
      - "requirements.txt"
      - "solohost/**"
      - ".github/workflows/publish-solohost-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/roberhood314/trace-ai:1.4.5-rc2
            ghcr.io/roberhood314/trace-ai:solohost
          labels: |
            org.opencontainers.image.source=https://github.com/Roberhood314/trace-ai
            org.opencontainers.image.title=TRACE-AI
            org.opencontainers.image.version=1.4.5-rc2
